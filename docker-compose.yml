# 云购数仓一键编排：MySQL(Metastore元数据库) + Hive Metastore + HiveServer2 + ClickHouse + Superset + Streamlit App
# 启动：docker compose up -d
# 敏感信息经根目录 .env 注入（已被 .gitignore 排除），模板见 .env.example
# 注意：apache/hive 镜像默认只内置 Derby/PostgreSQL 驱动，使用 MySQL 需要先下载
#   mysql-connector-j 的 jar 包放到 ./lib/ 目录下（见 metastore/hiveserver2 的 volumes 挂载）

services:
  mysql:
    image: mysql:8.0
    container_name: hive-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: metastore
      MYSQL_USER: hive
      MYSQL_PASSWORD: ${MYSQL_HIVE_PASSWORD:-hive123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  metastore:
    image: apache/hive:4.0.1
    container_name: hive-metastore
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      # 连接元数据库
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/metastore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${MYSQL_HIVE_PASSWORD:-hive123}
        -Dmetastore.warehouse.dir=/user/hive/warehouse
      TZ: Asia/Shanghai
    ports:
      - "9083:9083"
    volumes:
      # MySQL JDBC 驱动（下载后放到 ./lib/ 目录）
      - ./lib/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      # Hive 数据仓库目录（可按需挂载到宿主机）
      - hive_warehouse:/opt/hive/data/warehouse

  hiveserver2:
    image: apache/hive:4.0.1
    container_name: hive-hiveserver2
    restart: unless-stopped
    depends_on:
      - metastore
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://metastore:9083
        -Dhive.server2.tez.sessions.per.default.queue=1
        -Dhive.server2.async.exec.threads=20
      # 可选：关闭默认 beeline 脚本参数，便于外部连接调试
      IS_RESUME: "true"
      TZ: Asia/Shanghai
    ports:
      - "10000:10000"   # HiveServer2 Thrift (JDBC)
      - "10002:10002"   # HiveServer2 Web UI
    volumes:
      - ./lib/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      - hive_warehouse:/opt/hive/data/warehouse
    # 健康检查：beeline 冒烟查询，供下游服务（superset/app）等待就绪
    healthcheck:
      test: ["CMD-SHELL", "beeline -u jdbc:hive2://localhost:10000/default -n hive -e 'SELECT 1' --silent=true | grep -q '1 row' || beeline -u jdbc:hive2://localhost:10000/default -n hive -e 'SELECT 1' --silent=true | grep -qE '\\b1\\b'"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 90s

  # ---------- OLAP 引擎：ClickHouse（ADS 指标加速查询） ----------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: hive-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ads
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      TZ: Asia/Shanghai
    ulimits:
      nofile: 262144
    ports:
      - "8123:8123"    # HTTP 接口
      - "9000:9000"    # Native TCP
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping' | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- BI 可视化：Apache Superset ----------
  superset:
    image: apache/superset:4.1.1
    container_name: hive-superset
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      hiveserver2:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-please_change_me_in_env}
      SUPERSET_LOAD_EXAMPLES: "false"
      TZ: Asia/Shanghai
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/app/superset_home
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------- 智能问答应用：Streamlit（NL2SQL 闭环） ----------
  app:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    image: yungou-streamlit-app:latest
    container_name: hive-streamlit-app
    restart: unless-stopped
    depends_on:
      hiveserver2:
        condition: service_healthy
    environment:
      # 大模型密钥经 .env 注入，镜像与代码中不出现明文
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      LLM_MODEL: ${LLM_MODEL:-glm-4-flash}
      # 容器内经 pyhive 直连 HiveServer2（服务名即主机名）
      HIVE_URI: hive://hive@hiveserver2:10000/default?auth=NONE
      NL2SQL_DIR: /app/nl2sql_backend
      TZ: Asia/Shanghai
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8501/healthz')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  hive_warehouse:
  clickhouse_data:
  superset_data:
