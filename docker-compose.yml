# Hive 数仓编排：MySQL(Metastore 元数据库) + Hive Metastore + HiveServer2
# 启动：docker compose up -d
# 注意：apache/hive 镜像默认只内置 Derby/PostgreSQL 驱动，使用 MySQL 需要先下载
#   mysql-connector-j 的 jar 包放到 ./lib/ 目录下（见 metastore/hiveserver2 的 volumes 挂载）

services:
  mysql:
    image: mysql:8.0
    container_name: hive-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: metastore
      MYSQL_USER: hive
      MYSQL_PASSWORD: hive123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  metastore:
    image: apache/hive:4.0.1
    container_name: hive-metastore
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      # 连接元数据库
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/metastore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive123
        -Dmetastore.warehouse.dir=/user/hive/warehouse
      TZ: Asia/Shanghai
    ports:
      - "9083:9083"
    volumes:
      # MySQL JDBC 驱动（下载后放到 ./lib/ 目录）
      - ./lib/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      # Hive 数据仓库目录（可按需挂载到宿主机）
      - hive_warehouse:/opt/hive/data/warehouse

  hiveserver2:
    image: apache/hive:4.0.1
    container_name: hive-hiveserver2
    restart: unless-stopped
    depends_on:
      - metastore
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://metastore:9083
      # 可选：关闭默认 beeline 脚本参数，便于外部连接调试
      IS_RESUME: "true"
      TZ: Asia/Shanghai
    ports:
      - "10000:10000"   # HiveServer2 Thrift (JDBC)
      - "10002:10002"   # HiveServer2 Web UI
    volumes:
      - ./lib/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar:ro
      - hive_warehouse:/opt/hive/data/warehouse

volumes:
  mysql_data:
  hive_warehouse:
